<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="molten-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3d00" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#ff9100" stop-opacity="1"/>
      <stop offset="70%" stop-color="#ffea00" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff3d00" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="laser-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="40" cy="40" r="1.2" fill="#334155" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.75; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes scanLine {
      0% { transform: translateX(0); }
      50% { transform: translateX(1160px); }
      100% { transform: translateX(0); }
    }
    .laser-beam {
      stroke-dasharray: 60, 20;
      animation: beamFlow 10s linear infinite;
    }
    .scanner {
      animation: scanLine 8s ease-in-out infinite;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1280" height="380" fill="url(#bg-grad)"/>
  <rect width="1280" height="380" fill="url(#grid)"/>

  <!-- Ambient Molten Foundry Glow in Background (Underneath) -->
  <circle cx="640" cy="380" r="280" fill="#ff5722" opacity="0.12" filter="url(#laser-glow)">
    <animate attributeName="opacity" values="0.08;0.16;0.08" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="80" r="200" fill="#0284c7" opacity="0.09" filter="url(#laser-glow)"/>
  <circle cx="160" cy="120" r="180" fill="#ff9100" opacity="0.08" filter="url(#laser-glow)"/>

  <!-- Animated Tech Circuit Lines & Telemetry Paths -->
  <g opacity="0.45">
    <path d="M 60 70 L 300 70 L 360 130 L 920 130 L 980 70 L 1220 70" fill="none" stroke="#1e293b" stroke-width="2"/>
    <path d="M 60 70 L 300 70 L 360 130 L 920 130 L 980 70 L 1220 70" fill="none" stroke="url(#cyan-glow)" stroke-width="2" class="laser-beam"/>
    
    <path d="M 100 320 L 400 320 L 460 260 L 820 260 L 880 320 L 1180 320" fill="none" stroke="#334155" stroke-width="1.5"/>
    <path d="M 100 320 L 400 320 L 460 260 L 820 260 L 880 320 L 1180 320" fill="none" stroke="url(#molten-glow)" stroke-width="1.8" class="laser-beam" style="animation-direction: reverse; animation-duration: 7s;"/>
  </g>

  <!-- Dynamic Molten Steel Strip / Mill Output Track -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="1160" height="6" fill="#334155" rx="3"/>
    <rect x="0" y="0" width="1160" height="6" fill="url(#molten-glow)" rx="3" filter="url(#soft-glow)"/>
    <!-- Laser scanner head passing along the strip -->
    <g class="scanner">
      <circle cx="0" cy="3" r="7" fill="#ffffff" filter="url(#laser-glow)"/>
      <circle cx="0" cy="3" r="3" fill="#ffea00"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#ff9100" stroke-width="1.5" opacity="0.6" filter="url(#laser-glow)"/>
    </g>
  </g>

  <!-- FOREGROUND LAYER: Content, Badges & Typography (Guaranteed Unobscured) -->
  <g id="foreground-content">
    <!-- Top Category Badge Pill -->
    <g transform="translate(640, 52)">
      <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.95"/>
      <circle cx="-165" cy="0" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="5" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="2.5" text-anchor="middle">
        METALLURGY • SMART MES • PREDICTIVE AI
      </text>
    </g>

    <!-- Main Title -->
    <g transform="translate(640, 125)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">
        MODERNIZED METAL MILL OPERATIONS
      </text>
      <!-- Molten Underline Accent -->
      <rect x="-240" y="14" width="480" height="3.5" rx="1.75" fill="url(#molten-glow)" filter="url(#soft-glow)"/>
    </g>

    <!-- Subtitle / Value Proposition -->
    <g transform="translate(640, 185)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" letter-spacing="0.5" text-anchor="middle">
        Curated Directory of Enterprise SaaS Platforms &amp; Open-Source Infrastructure
      </text>
      <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#cbd5e1" text-anchor="middle">
        From Melt Shop Level-2/Level-3 Automation to Coil Quality AI &amp; Shop-Floor Digital Twins
      </text>
    </g>

    <!-- Interactive / Status Pills in Row -->
    <g transform="translate(640, 275)">
      <!-- Pill 1: Melt Shop Optimization -->
      <g transform="translate(-390, 0)">
        <rect x="-115" y="-18" width="230" height="36" rx="8" fill="url(#card-grad)" stroke="#ff5722" stroke-width="1.2"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffab91" text-anchor="middle">
          🔥 Melt Shop Optimization
        </text>
      </g>

      <!-- Pill 2: Coil Quality Execution -->
      <g transform="translate(-130, 0)">
        <rect x="-115" y="-18" width="230" height="36" rx="8" fill="url(#card-grad)" stroke="#ff9100" stroke-width="1.2"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffd180" text-anchor="middle">
          🏭 Quality Execution (QES)
        </text>
      </g>

      <!-- Pill 3: Time-Series AI -->
      <g transform="translate(130, 0)">
        <rect x="-115" y="-18" width="230" height="36" rx="8" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#bae6fd" text-anchor="middle">
          ⚡ Plant-Scale AI Monitoring
        </text>
      </g>

      <!-- Pill 4: Open-Source MES -->
      <g transform="translate(390, 0)">
        <rect x="-115" y="-18" width="230" height="36" rx="8" fill="url(#card-grad)" stroke="#4ade80" stroke-width="1.2"/>
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#bbf7d0" text-anchor="middle">
          🌐 Open-Source MES &amp; Twins
        </text>
      </g>
    </g>
  </g>
</svg>
